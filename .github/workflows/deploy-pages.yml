name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Experience OG images
        uses: actions/cache@v4
        with:
          path: public/generated/experience
          key: experience-og-${{ hashFiles('data/experience-preview.json', 'i18n/locales/*/home.json', 'scripts/generateExperiencePreviews.ts') }}
          restore-keys: |
            experience-og-

      - name: Generate static Experience OG images
        run: pnpm generate:experience-preview && pnpm generate:experience-preview:static

      - name: Build static site
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_URL: https://tetsugo02.github.io

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
